pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // GeckoView ships from Mozilla's own Maven repository.
        maven { url "https://maven.mozilla.org/maven2" }
    }
}

rootProject.name = "Zerium G"
include ':app'
